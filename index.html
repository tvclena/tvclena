  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      scrollbar-width: none
    }

    *::-webkit-scrollbar {
      display: none

    :root {
      --bg: #0f0f10;
      --surface: #1b1b1e;
      --card: #232326;
      --accent: #e50914;
      --text: #fff;
      --muted: #b5b5b5;
    }

    body {
      font-family: Inter, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    /* ================ HEADER ================ */
    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 64px;

      z-index: 100;
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 0 40px;

      background: linear-gradient(to bottom,
          rgba(0, 0, 0, .9),
          rgba(0, 0, 0, .5),
          rgba(0, 0, 0, 0));
    }


    /* PERFIL */
    #perfilBtn {
      margin-left: auto;
      cursor: pointer;
    }

    #perfilBtn span {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: var(--accent);
      font-weight: 700;
    }

    header input {
      font-size: 16px;
    }

    input,
    textarea,
    select {
      touch-action: manipulation;
    }

    /* ================= HERO ================= */
    .hero {
      height: 85vh;
      padding: 64px 40px 80px;
      /* sÃ³ empurra o conteÃºdo */
      display: flex;
      align-items: flex-end;
      position: relative;
      overflow: hidden;
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        linear-gradient(to right,
          rgba(0, 0, 0, .88) 0%,
          rgba(0, 0, 0, .75) 35%,
          rgba(0, 0, 0, .45) 55%,
          rgba(0, 0, 0, .15) 70%,
          rgba(0, 0, 0, 0) 85%),
        linear-gradient(to top,
          rgba(0, 0, 0, .65) 0%,
          rgba(0, 0, 0, .35) 30%,
          rgba(0, 0, 0, 0) 60%);
    }


    .hero-content {
      position: relative;
      z-index: 2;
      max-width: 560px;
    }

    .hero-content h2 {
      font-size: 52px;
      margin-bottom: 12px;
      text-shadow: 0 4px 24px rgba(0, 0, 0, .9);
    }

    .hero-content .meta {
      color: var(--muted);
      margin-bottom: 12px;
    }

    .hero-content p {
      line-height: 1.6;
      margin-bottom: 22px;
      text-shadow: 0 2px 12px rgba(0, 0, 0, .9);
    }

    .hero-desc {
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .hero-desc.expand {
      -webkit-line-clamp: unset;
    }

    .ler-mais {
      margin-top: -12px;
      margin-bottom: 18px;
      font-size: 14px;
      color: #3ea6ff;
      cursor: pointer;
      font-weight: 600;
    }

    .ler-mais:hover {
      text-decoration: underline;
    }


    .hero-content button {
      padding: 14px 32px;
      font-size: 16px;
      font-weight: 700;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background: var(--accent);
      color: #fff;
    }

    /* REFORÃ‡O DO GRADIENTE NO DESKTOP */
    @media (min-width:1024px) {
      .hero::before {
        background:
          linear-gradient(to right,
            rgba(0, 0, 0, .92) 0%,
            rgba(0, 0, 0, .8) 40%,
            rgba(0, 0, 0, .45) 60%,
            rgba(0, 0, 0, 0) 85%),
          linear-gradient(to top,
            rgba(0, 0, 0, .7) 0%,
            rgba(0, 0, 0, .4) 30%,
            rgba(0, 0, 0, 0) 60%);
      }
    }

    @media (max-width:768px) {

        height: 60vh;
        object-fit: cover;
      }
    }

    #heroVideo {
      position: absolute;
      top: -28%;
      /* ðŸ”¥ sobe mais */
      left: 0;
      width: 100%;
      height: 150%;
      /* ðŸ”¥ cobre tudo */
      object-fit: cover;
      object-position: center 40%;
      z-index: 0;

    /* ================= FILTROS ================= */

    /* ================= FILTROS CATEGORIAS (SCROLL HORIZONTAL) ================= */

    .filtros-categorias {

      gap: 12px;

      overflow-y: hidden;

      white-space: nowrap;
      scroll-behavior: smooth;

    /* garante que os botÃµes nÃ£o quebrem */

    }

    .grid {

      gap: 20px;

    .card {

    /* ðŸ” POPUP SESSÃƒO PREMIUM */
    #sessaoOverlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .9);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      backdrop-filter: blur(6px);
    }

    .sessaoPopup {
      width: 420px;
      max-width: 92%;
      background: linear-gradient(180deg, #1b1b1e, #121214);
      border-radius: 20px;
      padding: 40px 32px;
      text-align: center;
      box-shadow: 0 50px 120px rgba(0, 0, 0, .85);
      animation: popupIn .35s cubic-bezier(.2, .8, .2, 1);
    }

    @keyframes popupIn {
      from {
        opacity: 0;
        transform: translateY(12px) scale(.96)
      }

      to {
        opacity: 1;

<script src="env.js"></script>
  <script>
    // Configuração dinâmica da URL base da API com fallback seguro
    const API_BASE_URL = (
      window.ENV?.API_BASE_URL ||
      window.ENV?.API_URL ||
      "https://bullet-occasions-enjoyed-satisfy.trycloudflare.com"
    ).replace(/\/+$/, "");

    // Estados Globais do Aplicativo
    let catalogoCompleto = { filmes: [], series: [] };
    let itensFiltrados = [];
    let itensExibidos = [];
    let heroItem = null;
    let paginaAtual = 1;
    const itensPorPagina = 12;
    
    let filtroTipo = 'todos';
    let filtroCategoria = 'todas';

    // Estados do Player de Séries
    let episodiosDaSerieAtual = [];
    let idEpisodioAtual = null;
    let monitoramentoProgressoInterval = null;

    // Helpers de Armazenamento e Autenticação
    function getSessionToken() {
      return localStorage.getItem("session_token") || "";
    }

    function authHeaders(extra = {}) {
      const token = getSessionToken();
      return {
        "Content-Type": "application/json",
        ...extra,
        ...(token ? { Authorization: `Bearer ${token}` } : {})
      };
    }

    async function apiFetch(path, options = {}) {
      const url = path.startsWith("http") ? path : `${API_BASE_URL}${path}`;
      const response = await fetch(url, options);
      if (response.status === 401 || response.status === 403) {
        logout();
        throw new Error("Sessão expirada. Faça login novamente.");
      }
      if (!response.ok) {
        const errorData = await response.json().catch(() => ({}));
        throw new Error(errorData.error || `Erro na requisição: ${response.status}`);
      }
      return response.json();
    }

    // Inicialização do Sistema
    document.addEventListener("DOMContentLoaded", () => {
      inicializarBusca();
      verificarSessao().then(() => {
        carregarCatalogo();
        configurarScrollInfinito();
      });
    });

    // Validar sessão do Usuário com o Servidor
    async function verificarSessao() {
      const token = getSessionToken();
      if (!token) {
        // Se a sua aplicação possuir tela de login separada, redirecione aqui.
        console.log("Nenhum token encontrado. Operando em modo de demonstração.");
        return;
      }
      try {
        const usuario = await apiFetch("/auth/session", {
          method: "POST",
          headers: authHeaders()
        });
        atualizarLayoutUsuario(usuario);
      } catch (err) {
        console.error("Erro ao validar sessão:", err.message);
      }
    }

    function atualizarLayoutUsuario(usuario) {
      const btnPerfil = document.querySelector("#perfilBtn span");
      if (btnPerfil && usuario.nome) {
        btnPerfil.textContent = usuario.nome.substring(0, 2).toUpperCase();
      }
      // Injeta os dados originais direto nos inputs do modal modular novo
      document.getElementById("perfilNomeNovo").value = usuario.nome || "";
      document.getElementById("perfilUsernameNovo").value = usuario.username || "";
      document.getElementById("perfilEmailNovo").textContent = usuario.email || "";
      document.getElementById("perfilPlanoNovo").textContent = usuario.plano || "Básico";
      document.getElementById("apexQtd").textContent = usuario.carteira ? usuario.carteira.toFixed(2) : "0.00";
      
      // Tratamentos estéticos de valores mockados/vencimentos
      document.getElementById("perfilValorNovo").textContent = usuario.plano === "Ultra" ? "R$ 45,90" : usuario.plano === "Premium" ? "R$ 29,90" : "R$ 19,90";
      document.getElementById("perfilVencimentoNovo").textContent = "Renovação Automática";

      if (usuario.avatar_url) {
        document.getElementById("perfilAvatarNovo").src = usuario.avatar_url;
      } else {
        document.getElementById("perfilAvatarNovo").src = "https://via.placeholder.com/150";
      }
    }

    // Carregar e processar o Catálogo de mídias
    async function carregarCatalogo() {
      try {
        const dados = await apiFetch("/api/catalogo");
        catalogoCompleto.filmes = dados.filmes || [];
        catalogoCompleto.series = dados.series || [];
        
        gerarFiltrosCategorias();
        aplicarFiltros();
        configurarHero();
      } catch (err) {
        console.error("Erro ao carregar o catálogo:", err.message);
      }
    }

    // Configuração do Banner de Destaque (Hero)
    function configurarHero() {
      const todosItens = [...catalogoCompleto.filmes, ...catalogoCompleto.series];
      if (todosItens.length === 0) return;

      // Seleciona um item aleatório para ser o destaque do banner
      heroItem = todosItens[Math.floor(Math.random() * todosItens.length)];
      
      document.getElementById("heroTitle").textContent = heroItem.titulo;
      document.getElementById("heroDesc").textContent = heroItem.descricao || "Sem descrição disponível.";
      document.getElementById("heroMeta").textContent = `${heroItem.categoria || "Geral"} • ${heroItem.ano || "Conteúdo"} • ${heroItem.classificacao || "Livre"}`;
      
      const videoFundo = document.getElementById("heroVideo");
      if (heroItem.video_url) {
        videoFundo.src = heroItem.video_url;
        videoFundo.style.display = "block";
        videoFundo.play().catch(() => console.log("Autoplay bloqueado pelo navegador. Aguardando interação."));
      } else {
        videoFundo.style.display = "none";
        document.getElementById("hero").style.backgroundImage = `url('${heroItem.capa_url}')`;
        document.getElementById("hero").style.backgroundSize = "cover";
        document.getElementById("hero").style.backgroundPosition = "center";
      }
    }

    // Geração dinâmica de botões de categoria baseada no retorno do banco
    function gerarFiltrosCategorias() {
      const container = document.getElementById("filtrosCategorias");
      container.innerHTML = `<button class="active" onclick="setFiltroCategoria('todas', this)">Todas as Categorias</button>`;
      
      const todosItens = [...catalogoCompleto.filmes, ...catalogoCompleto.series];
      const categoriasUnicas = [...new Set(todosItens.map(item => item.categoria).filter(Boolean))];

      categoriasUnicas.forEach(cat => {
        const btn = document.createElement("button");
        btn.textContent = cat;
        btn.onclick = (e) => setFiltroCategoria(cat, e.target);
        container.appendChild(btn);
      });
    }

    function setFiltro(tipo, elemento) {
      document.querySelectorAll(".filtros button").forEach(b => b.classList.remove("active"));
      elemento.classList.add("active");
      filtroTipo = tipo;
      aplicarFiltros();
    }

    function setFiltroCategoria(categoria, elemento) {
      document.querySelectorAll("#filtrosCategorias button").forEach(b => b.classList.remove("active"));
      elemento.classList.add("active");
      filtroCategoria = categoria;
      aplicarFiltros();
    }

    // Regras de filtragem locais combinando os dois escopos de botões
    function aplicarFiltros() {
      let lista = [];

      if (filtroTipo === 'todos') {
        lista = [...catalogoCompleto.filmes, ...catalogoCompleto.series];
      } else if (filtroTipo === 'filme') {
        lista = catalogoCompleto.filmes.filter(f => f.tipo !== 'documentarios');
      } else if (filtroTipo === 'serie') {
        lista = catalogoCompleto.series;
      } else if (filtroTipo === 'documentarios') {
        lista = catalogoCompleto.filmes.filter(f => f.tipo === 'documentarios');
      }

      if (filtroCategoria !== 'todas') {
        lista = lista.filter(item => item.categoria === filtroCategoria);
      }

      itensFiltrados = lista;
      paginaAtual = 1;
      itensExibidos = [];
      document.getElementById("grid").innerHTML = "";
      renderizarMaisItens();
    }

    // Renderização com paginação progressiva
    function renderizarMaisItens() {
      const inicio = (paginaAtual - 1) * itensPorPagina;
      const fim = inicio + itensPorPagina;
      const proximosItens = itensFiltrados.slice(inicio, fim);

      if (proximosItens.length === 0) return;

      const grid = document.getElementById("grid");
      proximosItens.forEach(item => {
        const card = document.createElement("div");
        card.className = "card";
        card.onclick = () => abrirPlayer(item);

        card.innerHTML = `
          <img src="${item.capa_url || 'https://via.placeholder.com/180x260'}" alt="${item.titulo}" loading="lazy">
          <div class="title">${item.titulo}</div>
        `;
        grid.appendChild(card);
        itensExibidos.push(item);
      });
    }

    function configurarScrollInfinito() {
      const sentinela = document.getElementById("sentinela");
      const observer = new IntersectionObserver((entries) => {
        if (entries[0].isIntersecting && itensExibidos.length < itensFiltrados.length) {
          paginaAtual++;
          renderizarMaisItens();
        }
      }, { threshold: 0.1 });
      
      observer.observe(sentinela);
    }

    // ==========================================
    // SISTEMA DO PLAYER (FILMES VS SÉRIES)
    // ==========================================
    async function abrirPlayer(item) {
      if (!item) return;
      const playerContainer = document.getElementById("player");
      const videoElement = document.getElementById("video");
      const isFilme = Object.prototype.hasOwnProperty.call(item, 'video_url');

      playerContainer.style.display = "block";
      document.getElementById("pTitle").textContent = item.titulo;
      document.getElementById("pDesc").textContent = item.descricao || "";
      document.getElementById("pMeta").textContent = `${item.categoria || ""} • ${item.ano || ""}`;

      if (isFilme) {
        // Comportamento para Filmes
        document.getElementById("serieControls").style.display = "none";
        document.getElementById("btnProximo").style.display = "none";
        videoElement.src = item.video_url;
        
        // Registrar início no Histórico via API externa
        enviarHistorico(item.id, 0);
        configurarLogProgresso(item.id);
      } else {
        // Comportamento para Séries
        document.getElementById("serieControls").style.display = "block";
        await carregarEpisodiosDaSerie(item.id);
      }
    }

    async function carregarEpisodiosDaSerie(serieId) {
      try {
        episodiosDaSerieAtual = await apiFetch(`/api/episodios/${serieId}`);
        
        const selTemporada = document.getElementById("selTemporada");
        const selEpisodio = document.getElementById("selEpisodio");
        
        selTemporada.innerHTML = "";
        selEpisodio.innerHTML = "";

        if (episodiosDaSerieAtual.length === 0) {
          selTemporada.innerHTML = "<option>Nenhum episódio localizado</option>";
          return;
        }

        // Isolar temporadas existentes
        const temporadas = [...new Set(episodiosDaSerieAtual.map(ep => ep.temporada))].sort((a,b) => a - b);
        temporadas.forEach(t => {
          selTemporada.innerHTML += `<option value="${t}">Temporada ${t}</option>`;
        });

        selTemporada.onchange = () => atualizarListaEpisodiosDisponiveis(selTemporada.value);
        selEpisodio.onchange = () => alternarVideoParaEpisodio(selEpisodio.value);

        // Inicializar com a primeira temporada carregada
        atualizarListaEpisodiosDisponiveis(temporadas[0]);

      } catch (err) {
        console.error("Erro ao carregar episódios:", err.message);
      }
    }

    function atualizarListaEpisodiosDisponiveis(temporadaSelecionada) {
      const selEpisodio = document.getElementById("selEpisodio");
      selEpisodio.innerHTML = "";

      const epsFiltrados = episodiosDaSerieAtual
        .filter(ep => ep.temporada == temporadaSelecionada)
        .sort((a,b) => a.episodio - b.episodio);

      epsFiltrados.forEach(ep => {
        selEpisodio.innerHTML += `<option value="${ep.id}">Ep. ${ep.episodio} - ${ep.titulo}</option>`;
      });

      if (epsFiltrados.length > 0) {
        alternarVideoParaEpisodio(epsFiltrados[0].id);
      }
    }

    function alternarVideoParaEpisodio(idEpisodio) {
      idEpisodioAtual = idEpisodio;
      const episodio = episodiosDaSerieAtual.find(ep => ep.id == idEpisodio);
      if (!episodio) return;

      const videoElement = document.getElementById("video");
      videoElement.src = episodio.video_url;
      
      enviarHistorico(episodio.id, 0);
      configurarLogProgresso(episodio.id);

      // Ouvinte para ativação do gatilho de "Próximo Episódio" antes do encerramento da timeline
      videoElement.ontimeupdate = () => {
        const tempoRestante = videoElement.duration - videoElement.currentTime;
        const btnProximo = document.getElementById("btnProximo");
        
        if (tempoRestante <= 60 && obterProximoEpisodioEstrutura()) {
          btnProximo.style.display = "block";
        } else {
          btnProximo.style.display = "none";
        }
      };
    }

    function obterProximoEpisodioEstrutura() {
      if (!idEpisodioAtual || episodiosDaSerieAtual.length === 0) return null;
      const indexAtual = episodiosDaSerieAtual.findIndex(ep => ep.id == idEpisodioAtual);
      if (indexAtual !== -1 && indexAtual + 1 < episodiosDaSerieAtual.length) {
        return episodiosDaSerieAtual[indexAtual + 1];
      }
      return null;
    }

    function irProximoEpisodio() {
      const proximo = obterProximoEpisodioEstrutura();
      if (proximo) {
        document.getElementById("selTemporada").value = proximo.temporada;
        const selEpisodio = document.getElementById("selEpisodio");
        
        // Sincroniza selects visuais
        const epsFiltrados = episodiosDaSerieAtual
          .filter(ep => ep.temporada == proximo.temporada)
          .sort((a,b) => a.episodio - b.episodio);
          
        selEpisodio.innerHTML = "";
        epsFiltrados.forEach(ep => {
          selEpisodio.innerHTML += `<option value="${ep.id}">Ep. ${ep.episodio} - ${ep.titulo}</option>`;
        });

        selEpisodio.value = proximo.id;
        alternarVideoParaEpisodio(proximo.id);
      }
    }

    function configurarLogProgresso(conteudoId) {
      if (monitoramentoProgressoInterval) clearInterval(monitoramentoProgressoInterval);
      
      monitoramentoProgressoInterval = setInterval(() => {
        const videoElement = document.getElementById("video");
        if (videoElement && !videoElement.paused) {
          enviarHistorico(conteudoId, Math.floor(videoElement.currentTime));
        }
      }, 10000); // Envia telemetria a cada 10 segundos para persistência
    }

    async function enviarHistorico(conteudoId, progresso) {
      if (!getSessionToken()) return;
      try {
        await fetch(`${API_BASE_URL}/historico`, {
          method: "POST",
          headers: authHeaders(),
          body: JSON.stringify({ conteudo_id: conteudoId, progresso: progresso })
        });
      } catch (e) {
        console.log("Erro ao atualizar histórico em segundo plano.");
      }
    }

    function fechar() {
      const videoElement = document.getElementById("video");
      if (videoElement) {
        videoElement.pause();
        videoElement.src = "";
      }
      if (monitoramentoProgressoInterval) clearInterval(monitoramentoProgressoInterval);
      document.getElementById("player").style.display = "none";
    }

    // ==========================================
    // SISTEMA DE INTERFACE DO MOTOR DE BUSCA
    // ==========================================
    function inicializarBusca() {
      const buscaDesktop = document.getElementById("busca");
      const buscaMobile = document.getElementById("buscaMobile");
      const searchBtnMobile = document.getElementById("searchBtn");
      const searchMobileBox = document.getElementById("searchMobileBox");
      const searchResults = document.getElementById("searchResults");

      const processarTermoBusca = (termo) => {
        if (!termo.trim()) {
          searchResults.style.display = "none";
          document.body.classList.remove("search-open");
          return;
        }

        const todosItens = [...catalogoCompleto.filmes, ...catalogoCompleto.series];
        const resultados = todosItens.filter(item => 
          item.titulo.toLowerCase().includes(termo.toLowerCase()) || 
          (item.categoria && item.categoria.toLowerCase().includes(termo.toLowerCase()))
        );

        exibirResultadosPesquisa(resultados);
      };

      buscaDesktop.addEventListener("input", (e) => processarTermoBusca(e.target.value));
      buscaMobile.addEventListener("input", (e) => processarTermoBusca(e.target.value));

      searchBtnMobile.addEventListener("click", () => {
        const estaVisivel = searchMobileBox.style.display === "block";
        searchMobileBox.style.display = estaVisivel ? "none" : "block";
        if (!estaVisivel) {
          buscaMobile.focus();
          document.body.classList.add("search-open");
        } else {
          searchResults.style.display = "none";
          document.body.classList.remove("search-open");
        }
      });

      // Fechamento da caixa de pesquisa flutuante ao clicar fora
      document.addEventListener("click", (e) => {
        if (!searchResults.contains(e.target) && 
            !buscaDesktop.contains(e.target) && 
            !buscaMobile.contains(e.target) && 
            !searchBtnMobile.contains(e.target)) {
          searchResults.style.display = "none";
          searchMobileBox.style.display = "none";
          document.body.classList.remove("search-open");
        }
      });
    }

    function exibirResultadosPesquisa(resultados) {
      const grid = document.getElementById("searchGrid");
      const container = document.getElementById("searchResults");
      grid.innerHTML = "";

      if (resultados.length === 0) {
        grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: #777; padding: 20px;">Nenhum conteúdo correspondente localizado.</div>`;
      } else {
        resultados.forEach(item => {
          const card = document.createElement("div");
          card.className = "search-card";
          card.onclick = () => {
            container.style.display = "none";
            document.body.classList.remove("search-open");
            abrirPlayer(item);
          };

          card.innerHTML = `
            <img src="${item.capa_url || 'https://via.placeholder.com/140x200'}" alt="${item.titulo}">
            <span>${item.titulo}</span>
          `;
          grid.appendChild(card);
        });
      }
      container.style.display = "block";
    }

    // ==========================================
    // SEÇÃO PERFIL, AVATAR E CARTEIRA (MODULAR)
    // ==========================================
    function perfilAbrir() {
      document.getElementById("perfilOverlayNovo").style.display = "flex";
      document.body.classList.add("modal-open");
    }

    function perfilFechar() {
      document.getElementById("perfilOverlayNovo").style.display = "none";
      document.body.classList.remove("modal-open");
    }

    async function perfilSalvar() {
      const nome = document.getElementById("perfilNomeNovo").value;
      const username = document.getElementById("perfilUsernameNovo").value;

      try {
        // Envia atualização cadastral estruturada ao backend SQLite
        await apiFetch("/perfil", {
          method: "PATCH",
          headers: authHeaders(),
          body: JSON.stringify({ nome, username })
        });
        alert("Perfil atualizado com sucesso!");
        perfilFechar();
        verificarSessao();
      } catch (err) {
        alert(err.message);
      }
    }

    async function perfilUploadAvatar(inputElement) {
      if (!inputElement.files || inputElement.files.length === 0) return;
      
      const formData = new FormData();
      formData.append("avatar", inputElement.files[0]);

      try {
        const response = await fetch(`${API_BASE_URL}/perfil/avatar`, {
          method: "POST",
          headers: {
            "Authorization": `Bearer ${getSessionToken()}`
          },
          body: formData
        });

        if (!response.ok) throw new Error("Falha ao subir imagem.");
        
        const resultado = await response.json();
        document.getElementById("perfilAvatarNovo").src = resultado.avatar_url;
        verificarSessao();
      } catch (err) {
        alert("Erro no upload do avatar: " + err.message);
      }
    }

    function perfilValidarUsername() {
      // Implementação visual opcional em tempo de digitação
      const status = document.getElementById("perfilUsernameStatus");
      status.textContent = "Disponível para alteração";
      status.style.color = "#22c55e";
    }

    // Gerenciamento de janelas e carregamentos da Carteira de Crédito
    function abrirApexInfo() {
      document.getElementById("apexOverlay").style.display = "flex";
    }

    function fecharApexInfo() {
      document.getElementById("apexOverlay").style.display = "none";
      // Revalida a carteira local quando fechar a janela externa de recargas
      verificarSessao();
    }

    function abrirFiltrosAvancados() {
      alert("Painel de Filtros Avançados integrado ao Core nativo.");
    }

    function logout() {
      localStorage.removeItem("session_token");
      alert("Sessão finalizada.");
      window.location.reload();
    }
  </script>
